<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicholas & Christine | Wedding 2027</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap');
        :root { --emerald: #046307; --gold: #D4AF37; --white: #FFFFFF; --camel: #C19A6B; }
        body { margin: 0; font-family: 'Playfair Display', serif; background: var(--white); background-image: url('https://img.magnific.com/premium-vector/wedding-background-with-hand-drawn-floral-ornaments_1215-320.jpg?w=900'); background-size: cover; background-attachment: fixed; background-position: center; color: #333; overflow-x: hidden; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; background: rgba(255,255,255,0.9); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        header { background: var(--emerald); padding: 60px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .names { font-family: 'Great Vibes', cursive; font-size: 5rem; color: var(--gold); margin: 0; text-shadow: 0 0 15px rgba(212,175,55,0.6); }
        .sub-header { color: var(--white); letter-spacing: 5px; font-size: 1.5rem; margin-top: 15px; font-weight: bold; }
        button { background: linear-gradient(135deg, var(--gold), var(--camel)); color: white; border: none; padding: 15px 40px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 50px; transition: 0.3s; text-transform: uppercase; }
        .time-box { background: var(--emerald); color: var(--gold); padding: 15px; border-radius: 10px; min-width: 80px; }
        .time-box span { display: block; font-size: 2rem; font-weight: bold; }
        .timeline { position: relative; margin: 40px 0; padding: 20px 0; }
        .timeline::after { content: ''; position: absolute; width: 4px; background: var(--gold); top: 0; bottom: 0; left: 50%; }
        .timeline-item { width: 45%; margin: 10px 0; padding: 20px; background: white; border-radius: 10px; border: 1px solid var(--gold); position: relative; box-sizing: border-box; }
        .left { float: left; text-align: right; }
        .right { float: right; text-align: left; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; border: 2px solid var(--gold); }
        .mobile-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--emerald); display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid var(--gold); z-index: 1000; }
        .mobile-nav a { color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<header><h1 class="names">Nicholas & Christine</h1><p class="sub-header">MAY 30, 2027</p></header>

<section class="container">
    <button onclick='raiseToast()' id='toastBtn' style='font-size:2rem;'>🥂 TOAST THE COUPLE</button>
    <p id='toastCount' style='font-weight:bold; color:var(--emerald); margin-top:10px;'>Loading Toasts...</p>
    <div id="countdown" style="display:flex; justify-content:center; gap:15px; margin-top:30px;">
        <div class="time-box"><span id="days">00</span>DAYS</div>
        <div class="time-box"><span id="hours">00</span>HRS</div>
        <div class="time-box"><span id="minutes">00</span>MIN</div>
        <div class="time-box"><span id="seconds">00</span>SEC</div>
    </div>
</section>

<section class="container">
    <h2>Our Journey</h2>
    <div class="timeline" style="overflow:hidden;">
        <div class="timeline-item left"><h3>The Meeting</h3><p>Day 1.</p></div>
        <div class="timeline-item right"><h3>The Proposal</h3><p>The Big Yes.</p></div>
    </div>
</section>

<section class="container">
    <h2>Memory Wall</h2>
    <input type="file" id="photoInput" style="display:none">
    <button onclick="document.getElementById('photoInput').click()">UPLOAD PHOTO</button>
    <div id="memoryGrid" class="gallery-grid" style="margin-top:20px"></div>
</section>

<section class="container">
    <h2>Requested Playlist</h2>
    <div id="songFeed" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
</section>

<section class="container" id="rsvp-section">
    <h2>Kindly RSVP</h2>
    <form onsubmit="submitRSVP(event)" style="text-align:left; max-width:400px; margin:0 auto;">
        <input type="text" name="guest_name" required placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;"><br>
        <select name="attendance" style="width:100%; padding:10px; margin-bottom:10px;"><option value="yes">Accepts with Pleasure</option><option value="no">Declines with Regret</option></select><br>
        <input type="text" name="song" placeholder="Song Request" style="width:100%; padding:10px; margin-bottom:10px;"><br>
        <button type="submit" style="width:100%;">SUBMIT RSVP</button>
    </form>
</section>

<section class="container">
    <h2>Share the Vibe</h2>
    <img src='/qr' style='width:150px; border:5px solid var(--gold); border-radius:10px;'><br>
    <small>Scan to share this link</small>
</section>

<div class="mobile-nav">
    <a href="#rsvp-section">RSVP</a>
    <a href="#memoryGrid">PHOTOS</a>
    <a href="#" onclick="raiseToast(); return false;">TOAST</a>
</div>

<div onclick="toggleMusic()" id="musicBtn" style="position:fixed; bottom:80px; right:20px; font-size:2.5rem; cursor:pointer; background:white; border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,0.2);">🎵</div>
<audio id="bgMusic" loop><source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg"></audio>

<script>
    function startTimer() {
        const target = new Date('May 30, 2027 13:00:00').getTime();
        console.log('Timer Node Active'); setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if (isNaN(diff) || diff < 0) return;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);
    }

    let playing = false;
    function toggleMusic() {
        const a = document.getElementById('bgMusic');
        const b = document.getElementById('musicBtn');
        if(!playing) { a.play().then(() => { b.innerText = '⏸'; playing = true; }).catch(() => alert('Click anywhere first!')); }
        else { a.pause(); b.innerText = '🎵'; playing = false; }
    }

    async function raiseToast() {
        const r = await fetch('/api/toast', {method:'POST'});
        const d = await r.json();
        document.getElementById('toastCount').innerText = d.toasts + ' Toasts Raised';
    }

    async function submitRSVP(e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());
        await fetch('/api/rsvp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        alert('Thank you! RSVP recorded.');
        e.target.reset();
        loadSongs();
    }

    async function loadMemories() {
        const r = await fetch('/api/memories');
        const d = await r.json();
        const g = document.getElementById('memoryGrid');
        if(g) g.innerHTML = d.map(m => `<div class='gallery-item'><img src='/static/uploads/${m.filename}'></div>`).join('');
    }

    async function loadSongs() {
        const r = await fetch('/api/songs');
        const d = await r.json();
        const f = document.getElementById('songFeed');
        if(f) f.innerHTML = d.map(s => `<div style='background:var(--camel); color:white; padding:5px 15px; border-radius:20px; font-size:0.8rem;'><b>${s.song}</b> (${s.name})</div>`).join('');
    }

    window.onload = () => {
        startTimer(); loadMemories(); loadSongs();
        fetch('/api/toasts').then(r => r.json()).then(d => document.getElementById('toastCount').innerText = d.toasts + ' Toasts Raised');
        document.getElementById('photoInput').onchange = async (e) => {
            if(!e.target.files[0]) return;
            const fd = new FormData(); fd.append('file', e.target.files[0]);
            await fetch('/api/upload', {method:'POST', body:fd});
            loadMemories();
        };
    };
</script>
</body>
</html>
