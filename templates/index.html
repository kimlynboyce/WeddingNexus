<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicholas & Christine | Wedding 2027</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <h1 class="names">Nicholas & Christine</h1>
    <p class="sub-header">ARE GETTING MARRIED</p>
</header>
<section class="hero"><div class="container">
    <h2>Save the Date</h2><p>May 30, 2027 • 1:00 PM • Indian Arrival Day</p>
    <div id="countdown">
        <div class="time-box"><span id="days">00</span><label>Days</label></div>
        <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
        <div class="time-box"><span id="minutes">00</span><label>Minutes</label></div>
        <div class="time-box"><span id="seconds">00</span><label>Seconds</label></div>
    </div>
</div></section>
<section class="container"><div class="media-section">
    <h2>Live Ceremony Stream</h2>
    <div class="video-container"><iframe src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" frameborder="0" allowfullscreen></iframe></div>
</div></section>
<section class="container">
    <h2>Memory Wall</h2>
    <p>Upload a photo for our wedding album.</p>
    <input type="file" id="photoInput" style="display:none">
    <button onclick="document.getElementById('photoInput').click()">SELECT PHOTO</button>
    <div id="memoryGrid" class="gallery-grid" style="margin-top:20px"></div>
</section>
<section class="container" id="rsvp-section">
    <h2>Kindly RSVP</h2>
    <div class="rsvp-card"><form onsubmit="submitRSVP(event)">
        <input type="text" name="guest_name" required placeholder="Guest Name"><br><br>
        <select name="attendance"><option value="yes">Accepts</option><option value="no">Declines</option></select><br><br>
        <button type="submit">SUBMIT RSVP</button>
    </form></div>
</section>
<section class="container">
    <h2>Location</h2>
    <div class="video-container" style="background:#222; color:white; display:flex; align-items:center; justify-content:center;">
        <p>[Google Maps Substrate - Trinidad]</p>
    </div>
</section>
<footer><p>© 2027 Nicholas & Christine | Built by Cyrus</p></footer>
<script src="/static/script.js"></script>
</body></html>
