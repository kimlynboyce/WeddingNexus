<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicholas & Christine | 2027</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>Nicholas & Christine</h1><p>MAY 30, 2027</p></header>
<section class="hero"><div class="container">
    <button onclick='raiseToast()' id='toastBtn' style='font-size:1.5rem; padding:15px 30px; border-radius:50px; background:#D4AF37; color:white; border:none; cursor:pointer;'>🥂 TOAST</button>
    <p id='toastCount'>0 Toasts Raised</p>
    <div id="countdown" style="display:flex; justify-content:center; gap:20px; font-size:2rem; margin:20px 0;">
        <div><span id="days">00</span><br><small>Days</small></div>
        <div><span id="hours">00</span><br><small>Hrs</small></div>
        <div><span id="minutes">00</span><br><small>Min</small></div>
        <div><span id="seconds">00</span><br><small>Sec</small></div>
    </div>
</div></section>
<section class="container"><h2>Memory Wall</h2><input type="file" id="photoInput" style="display:none"><button onclick="document.getElementById('photoInput').click()">UPLOAD</button><div id="memoryGrid" class="gallery-grid" style="margin-top:20px"></div></section>
<section class="container" id="rsvp-section"><h2>RSVP</h2><form onsubmit="submitRSVP(event)"><input type="text" name="guest_name" placeholder="Name" required><br><select name="attendance"><option value="yes">Yes</option><option value="no">No</option></select><br><button type="submit">SUBMIT</button></form></section>
<div id="confirmation" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:40px; border:2px solid #046307; z-index:1000;"><h1>Thanks!</h1><button onclick="this.parentElement.style.display='none'">CLOSE</button></div>
<div class="music-toggle" onclick="toggleMusic()" id="musicBtn" style="position:fixed; bottom:20px; right:20px; font-size:2rem; cursor:pointer;">🎵</div>
<audio id="bgMusic" loop><source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg"></audio>
<script src="/static/script.js?v=20260821000842"></script>
</body></html>
