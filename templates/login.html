<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Nicholas & Christine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap');
        :root { --emerald: #046307; --gold: #D4AF37; --white: #FFFFFF; --camel: #C19A6B; }
        body {
            margin: 0;
            font-family: 'Playfair Display', serif;
            background: var(--emerald);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: rgba(255,255,255,0.97);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-sizing: border-box;
        }
        .login-box h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--gold);
            font-size: 2.5rem;
            margin: 0 0 5px 0;
        }
        .login-box p { color: #555; margin-bottom: 25px; }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, var(--gold), var(--camel));
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            text-transform: uppercase;
            width: 100%;
        }
        #error-msg {
            color: #b30000;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Admin Access</h1>
        <p>Enter PIN to continue</p>
        <form id="loginForm">
            <input type="password" id="pin" name="pin" placeholder="••••" inputmode="numeric" maxlength="10" required>
            <button type="submit">UNLOCK</button>
        </form>
        <p id="error-msg">Incorrect PIN. Please try again.</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'pin=' + encodeURIComponent(pin)
            });

            if (res.ok) {
                window.location.href = '/master-hub';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pin').value = '';
            }
        });
    </script>
</body>
</html>
